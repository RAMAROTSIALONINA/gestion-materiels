<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mouvements — Gestion des matériels</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/mouvements.js"></script>
</head>
<body>
  <header class="entete" id="entete">
    <a class="marque" href="/">Gestion des matériels</a>
  </header>
  <div id="messages" class="messages" aria-live="polite"></div>

  <main class="contenu contenu-large">
    <div class="barre-titre">
      <h1>Mouvements</h1>
      <a href="/mouvements/nouveau" id="nouveau" class="bouton" hidden>Nouveau mouvement</a>
    </div>
    <p class="aide">
      Réceptions, sorties, transferts, pertes et corrections. Un mouvement validé ne se modifie plus :
      il s’annule avec un motif, ou se corrige par un mouvement inverse autorisé.
    </p>

    <form class="filtres" id="filtres" role="search">
      <div class="champ champ-large">
        <label for="q">Rechercher</label>
        <input type="search" id="q" name="q" placeholder="Référence, ticket…" title="Référence, ticket, motif, article ou matériel" autocomplete="off">
      </div>
      <div class="champ">
        <label for="type_code">Type</label>
        <select id="type_code" name="type_code"><option value="">Tous</option></select>
      </div>
      <div class="champ">
        <label for="statut">Statut</label>
        <select id="statut" name="statut">
          <option value="">Tous</option>
          <option value="BROUILLON">Brouillons</option>
          <option value="VALIDE">Validés</option>
          <option value="ANNULE">Annulés</option>
        </select>
      </div>
      <div class="champ champ-periode">
        <label for="date_debut">Du</label>
        <input type="date" id="date_debut" name="date_debut">
        <label for="date_fin">au</label>
        <input type="date" id="date_fin" name="date_fin">
      </div>
      <div class="champ champ-cases">
        <label class="case" title="Transferts envoyés, pas encore réceptionnés"><input type="checkbox" name="en_route" value="oui"> En route</label>
        <label class="case" id="case-autoriser" title="Corrections et mouvements inverses à autoriser par moi" hidden><input type="checkbox" name="a_autoriser" value="oui"> À autoriser</label>
      </div>
    </form>

    <div class="tableau-conteneur">
      <table class="tableau">
        <thead>
          <tr>
            <th scope="col">Mouvement</th>
            <th scope="col">Type</th>
            <th scope="col">Contenu</th>
            <th scope="col">Lieux</th>
            <th scope="col">Statut</th>
            <th scope="col">Saisi par</th>
          </tr>
        </thead>
        <tbody id="lignes"><tr><td colspan="6" class="cellule-vide">Chargement…</td></tr></tbody>
      </table>
    </div>
    <div class="pagination" id="pagination"></div>
  </main>
</body>
</html>
